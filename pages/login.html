<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Family Budget - Login">
    <title>Login | Family Budget</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>

    <!-- header -->
    <header class="header">
        <div class="header__container">
            <a href="../index.html" class="header__logo"> Family Budget</a>
        </div>
    </header>

    <!-- main -->
    <main class="main">
        <div class="login">

            <h1 class="login__title">Welcome Back</h1>
            <p class="login__subtitle">Sign in to your family account</p>

            <!-- error notification -->
            <div class="notification notification--error" id="error-message">
                <span class="notification__text">Invalid username or password!</span>
            </div>

            <!-- login form -->
            <form class="form" id="login-form">

                <div class="form__group">
                    <label class="form__label" for="username">Username</label>
                    <input
                        class="form__input"
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >
                    <span class="form__error" id="username-error">Please enter your username</span>
                </div>

                <div class="form__group">
                    <label class="form__label" for="password">Password</label>
                    <input
                        class="form__input"
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                    <span class="form__error" id="password-error">Please enter your password</span>
                </div>

                <button class="btn btn--primary" type="submit">
                    Sign In
                </button>

            </form>

            <p class="login__register-link">
                Don't have an account?
                <a href="./register.html" class="login__link">Create one</a>
            </p>

        </div>
    </main>

    <!-- footer -->
    <footer class="footer">
        <div class="footer__container">
            <p class="footer__text">© 2026 Family Budget</p>
        </div>
    </footer>

</body>
</html>
